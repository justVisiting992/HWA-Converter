
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The FFmpegKit AAR is not stored in git (37 MB binary). It is fetched
      # from Maven Central and verified against the pinned hash — the same
      # hash recorded in app/libs/VENDORED.md. A changed binary fails here.
      - name: Fetch FFmpegKit AAR (hash-pinned)
        run: |
          curl -sL -o app/libs/ffmpeg-kit-full-gpl-8.1.9.aar \
            "https://repo1.maven.org/maven2/dev/ffmpegkit-maintained/ffmpeg-kit-full-gpl/8.1.9/ffmpeg-kit-full-gpl-8.1.9.aar"
          echo "72094919ac812598ec3f77ba2631e5b2dbd50b1daa98dfa64e9fc565f2b52ede  app/libs/ffmpeg-kit-full-gpl-8.1.9.aar" | sha256sum -c -

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mediaconverter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
