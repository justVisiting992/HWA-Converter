name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No SDK setup steps: GitHub's ubuntu-24.04 runner image already ships
      # platform android-35 and build-tools 35.0.0 under ANDROID_HOME
      # (verified against the runner-images readme). Both the setup-android
      # action and a manual sdkmanager call failed on current images, and
      # neither is needed.

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The FFmpegKit AAR is not stored in git (37 MB binary). It is fetched
      # from Maven Central and verified against the pinned hash — the same
      # hash recorded in app/libs/VENDORED.md. A changed binary fails here.
      - name: Fetch FFmpegKit AAR (hash-pinned)
        run: |
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors -o app/libs/ffmpeg-kit-full-gpl-8.1.9.aar \
            "https://repo1.maven.org/maven2/dev/ffmpegkit-maintained/ffmpeg-kit-full-gpl/8.1.9/ffmpeg-kit-full-gpl-8.1.9.aar"
          echo "72094919ac812598ec3f77ba2631e5b2dbd50b1daa98dfa64e9fc565f2b52ede  app/libs/ffmpeg-kit-full-gpl-8.1.9.aar" | sha256sum -c -

      # ABI splits (build.gradle.kts) produce three APKs:
      # app-arm64-v8a-debug.apk, app-x86_64-debug.apk, app-universal-debug.apk
      - name: Build debug APKs
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: mediaconverter-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Tagging a version (e.g. v0.1.0) publishes a GitHub Release with
      # the three APKs as downloadable assets. If the release was already
      # created by hand in the web UI (which is how the tag gets made),
      # the create fails and the APKs are uploaded into it instead.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APKS="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk app/build/outputs/apk/debug/app-x86_64-debug.apk app/build/outputs/apk/debug/app-universal-debug.apk"
          gh release create "${GITHUB_REF_NAME}" \
            --title "HWA Converter ${GITHUB_REF_NAME}" \
            --generate-notes \
            $APKS \
          || gh release upload "${GITHUB_REF_NAME}" $APKS --clobber